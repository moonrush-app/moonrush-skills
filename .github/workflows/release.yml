name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # A tag that disagrees with package.json publishes a version nobody can find by the
      # tag they were given, and the mistake is only visible afterwards.
      - name: Tag must match package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json ($PACKAGE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

      - run: npm publish --access public
